{% extends 'inventory/base.html' %}
{% block content %}

<style>
    .quick-list-item {
        display: flex;
        align-items: center;
    }

    .quick-list-item img,
    .quick-list-item .quick-thumb-placeholder {
        width: 60px;
        height: 60px;
        object-fit: cover;
        margin-right: 1rem;
        flex-shrink: 0;
    }

    .quick-list-item .quick-thumb-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eee;
        color: #999;
    }

    .quick-list-item-action {
        display: flex;
        align-items: center;
        flex-grow: 1;
        min-width: 0;
        color: inherit;
        text-decoration: none;
    }

    .quick-list-item-details {
        flex-shrink: 0;
        margin-left: 0.5rem;
    }
</style>

<div class="container pt-3">
    <div class="d-flex justify-content-between align-items-center pb-3">
        <h1>Store an item</h1>
        <a href="{% url 'inventory:new_item' %}" id="new-item-link" class="btn btn-primary">+ New Item</a>
    </div>

    <input type="search" id="quick-filter" class="form-control form-control-lg mb-3"
           placeholder="Type item name..." autofocus autocomplete="off"
           oninput="filterQuickList(this.value)">

    <div id="quick-list" class="list-group">
        {% for item in item_list %}
        <div class="list-group-item quick-list-item" data-name="{{ item.name|lower }}">
            <a href="{% url 'inventory:store_item' item.pk %}" class="quick-list-item-action">
                {% if item.main_photo %}
                <img src="{{ item.main_photo.image.url }}" alt="" loading="lazy">
                {% else %}
                <span class="quick-thumb-placeholder">No photo</span>
                {% endif %}
                <span>{{ item.name }}</span>
            </a>
            <a href="{% url 'inventory:item_detail' item.pk %}" class="quick-list-item-details small text-muted">Details</a>
        </div>
        {% empty %}
        <p class="text-muted">No items available to store right now.</p>
        {% endfor %}
    </div>
    <p id="quick-no-match" class="text-muted pt-3" style="display: none;">No matching items.</p>
</div>

<script>
    var newItemBaseUrl = "{% url 'inventory:new_item' %}";

    function filterQuickList(query) {
        query = query.trim().toLowerCase();
        var items = document.getElementsByClassName('quick-list-item');
        var visibleCount = 0;
        for (var i = 0; i < items.length; i++) {
            var match = items[i].getAttribute('data-name').indexOf(query) !== -1;
            items[i].style.display = match ? '' : 'none';
            if (match) visibleCount++;
        }
        document.getElementById('quick-no-match').style.display =
            (visibleCount === 0 && items.length > 0) ? '' : 'none';

        var newItemLink = document.getElementById('new-item-link');
        newItemLink.href = query ?
            newItemBaseUrl + '?name=' + encodeURIComponent(document.getElementById('quick-filter').value.trim()) :
            newItemBaseUrl;
    }
</script>
{% endblock %}
