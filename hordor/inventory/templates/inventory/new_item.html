{% extends 'inventory/base.html' %}
{% block content %}
<div class="container">
  <div class="container pt-3">
    <div class="row">
      <div class="col-md-6 col-xs-12">
        <h1>Add New Item</h1>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="form-group">
            <label for="id_photos">Photos</label>
            <input type="file" id="id_photos" name="photos" accept="image/*" capture="camera" multiple class="form-control-file">
            <small class="form-text text-muted">The first photo becomes the main photo. You can add more or change the main photo later, on the item's edit page.</small>
          </div>
          <button type="submit">Add Item</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
