<div class="card">
    <a href="{% url 'inventory:item_detail' item.id %}">
        {% if item.main_photo %}
        <img class="card-img-top" src="{{ item.main_photo.image.url }}" alt="{{ item.name }}" />
        {% else %}
        <div class="card-img-top d-flex align-items-center justify-content-center text-muted"
             style="height: 150px; background: #eee;">No photo</div>
        {% endif %}
        <div class="card-header">{{ item.name }}</div>
    </a>
</div>
