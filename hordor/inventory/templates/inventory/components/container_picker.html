{% comment %}
Searchable replacement for a plain <select> of containers, same
type-to-filter pattern as the item store/retrieve pickers. Renders
the real Django select hidden and drives its value from JS, so form
submission/validation is untouched.

Starts collapsed: the current selection itself is the tap target
(e.g. "Bag 14"). Tapping it expands the search box (auto-focused) +
list, which auto-collapses again once an option is picked. Include
with:
    {% include "inventory/components/container_picker.html" with select_field=form.container %}

Optionally pin an extra entry at the top of the list (e.g. a
"shortcut to the suggested value" option) whose click behaves exactly
like picking a real option with that value:
    {% include "inventory/components/container_picker.html" with select_field=form.container pinned_option_label="Auto select" pinned_option_value=bag.pk %}

Pass start_expanded=True to render already expanded (e.g. when there
is no sensible default to summarize):
    {% include "inventory/components/container_picker.html" with select_field=form.container start_expanded=True %}

Pass collapsed_label to show a fixed action label as the tap target
instead of the current selection (e.g. when the selection is already
shown elsewhere on the page):
    {% include "inventory/components/container_picker.html" with select_field=form.container collapsed_label="Select different container" %}
{% endcomment %}
<div class="form-group container-picker"
     data-pinned-label="{{ pinned_option_label|default:'' }}"
     data-pinned-value="{{ pinned_option_value|default:'' }}"
     data-start-expanded="{% if start_expanded %}1{% endif %}"
     data-collapsed-label="{{ collapsed_label|default:'' }}">
    <label>{{ select_field.label }}</label>

    <div class="container-picker-summary">
        <button type="button" class="btn btn-link p-0 container-picker-current"></button>
    </div>

    <div class="container-picker-expanded d-none">
        <input type="text" class="form-control container-picker-search mb-2"
               placeholder="Search containers..." autocomplete="off">
        <div class="list-group container-picker-list" style="max-height: 200px; overflow-y: auto;"></div>
    </div>

    <div class="d-none">{{ select_field }}</div>
</div>

<style>
    .container-picker-list .list-group-item {
        cursor: pointer;
        padding: 0.5rem 0.75rem;
    }

    .container-picker-list .list-group-item.active {
        z-index: 1;
    }

    .container-picker-list .container-picker-pinned {
        font-style: italic;
    }
</style>

<script>
    (function () {
        document.querySelectorAll('.container-picker').forEach(function (picker) {
            if (picker.dataset.picketInit) return;
            picker.dataset.picketInit = '1';

            var select = picker.querySelector('select');
            var search = picker.querySelector('.container-picker-search');
            var list = picker.querySelector('.container-picker-list');
            var current = picker.querySelector('.container-picker-current');
            var summary = picker.querySelector('.container-picker-summary');
            var expandedSection = picker.querySelector('.container-picker-expanded');
            var collapsedLabel = picker.dataset.collapsedLabel;

            var options = Array.from(select.options).map(function (opt) {
                return { value: opt.value, label: opt.textContent };
            });

            var pinnedLabel = picker.dataset.pinnedLabel;
            if (pinnedLabel) {
                options.unshift({ value: picker.dataset.pinnedValue, label: pinnedLabel, pinned: true });
            }

            function updateCurrent() {
                if (collapsedLabel) {
                    current.textContent = collapsedLabel;
                    return;
                }
                // Prefer a non-pinned match: the pinned entry (e.g. "Auto
                // select") shares its value with a real option, but the
                // summary should show the actual container name, not the
                // shortcut's label.
                var selected = options.find(function (o) { return !o.pinned && o.value === select.value; })
                    || options.find(function (o) { return o.value === select.value; });
                current.textContent = selected ? selected.label : 'None';
            }

            function renderList(filter) {
                list.innerHTML = '';
                filter = filter.trim().toLowerCase();
                options.forEach(function (opt) {
                    if (filter && opt.label.toLowerCase().indexOf(filter) === -1) return;
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action' + (opt.pinned ? ' container-picker-pinned' : '');
                    btn.textContent = opt.label;
                    if (opt.value === select.value) btn.classList.add('active');
                    btn.addEventListener('click', function () {
                        select.value = opt.value;
                        updateCurrent();
                        collapse();
                        picker.dispatchEvent(new CustomEvent('container-picker:change', {
                            detail: { value: opt.value, label: opt.label },
                            bubbles: true
                        }));
                    });
                    list.appendChild(btn);
                });
            }

            function expand() {
                summary.classList.add('d-none');
                expandedSection.classList.remove('d-none');
                search.value = '';
                renderList('');
                search.focus();
            }

            function collapse() {
                expandedSection.classList.add('d-none');
                summary.classList.remove('d-none');
            }

            current.addEventListener('click', expand);
            search.addEventListener('input', function () {
                renderList(search.value);
            });

            updateCurrent();
            renderList('');
            if (picker.dataset.startExpanded === '1') {
                expand();
            } else {
                collapse();
            }
        });
    })();
</script>
